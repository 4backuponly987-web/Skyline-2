<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrain de-risk</title>
<style>
  body { background:#101214; color:#cfd6dd; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; margin:0; padding:12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  figure { margin:0; }
  canvas { image-rendering: pixelated; border:1px solid #2a2f35; display:block; }
  figcaption { padding:4px 0; color:#8a949d; }
  #log { white-space:pre; padding:8px 0; color:#9fe0a0; }
</style>
</head>
<body>
<div id="log">baking…</div>
<div class="row">
  <figure><canvas id="shade" width="1024" height="1024"></canvas><figcaption>hillshade (eroded, sun from NW)</figcaption></figure>
  <figure><canvas id="pre" width="512" height="512"></canvas><figcaption>pre-erosion</figcaption></figure>
  <figure><canvas id="flow" width="512" height="512"></canvas><figcaption>flow / wetness</figcaption></figure>
  <figure><canvas id="ao" width="512" height="512"></canvas><figcaption>sky occlusion</figcaption></figure>
  <figure><canvas id="slice" width="1024" height="300"></canvas><figcaption>cross sections (with runtime detail)</figcaption></figure>
</div>
<script type="module">
import { TerrainField, WORLD } from '../src/world/field.js';

const log = document.getElementById('log');
const field = new TerrainField(new URLSearchParams(location.search).get('seed') || 'skyline');
window.FIELD = field;

function hillshade(canvas, grid, res, cell, { sunAz = -0.78, sunEl = 0.62, tint = true } = {}) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  const lx = Math.cos(sunAz) * Math.cos(sunEl);
  const ly = Math.sin(sunEl);
  const lz = Math.sin(sunAz) * Math.cos(sunEl);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const gx = Math.min(res - 2, Math.floor((x / w) * res));
      const gy = Math.min(res - 2, Math.floor((y / h) * res));
      const i = gy * res + gx;
      const hC = grid[i];
      const hR = grid[i + 1];
      const hD = grid[i + res];
      let nx = (hC - hR) / cell, ny = 1, nz = (hC - hD) / cell;
      const l = Math.hypot(nx, ny, nz);
      nx /= l; ny /= l; nz /= l;
      let d = Math.max(0, nx * lx + ny * ly + nz * lz);
      d = d * 0.88 + 0.12;
      const alt = Math.min(1, Math.max(0, (hC - 600) / 2400));
      let r, g, b;
      if (tint) {
        const snow = Math.min(1, Math.max(0, (alt - 0.45) * 2.4)) * Math.min(1, ny * 1.5);
        r = (90 + alt * 70) * d; g = (84 + alt * 66) * d; b = (76 + alt * 62) * d;
        r = r * (1 - snow) + 248 * d * snow;
        g = g * (1 - snow) + 250 * d * snow;
        b = b * (1 - snow) + 255 * d * snow;
        if (alt < 0.13) { g = g * 0.9 + 40 * d; }
      } else {
        r = g = b = d * 255;
      }
      const o = (y * w + x) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function grayscale(canvas, grid, res, scale = 1) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const gx = Math.min(res - 1, Math.floor((x / w) * res));
    const gy = Math.min(res - 1, Math.floor((y / h) * res));
    const v = Math.min(255, Math.max(0, grid[gy * res + gx] * scale * 255));
    const o = (y * w + x) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function sections() {
  const c = document.getElementById('slice');
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#15181b'; ctx.fillRect(0, 0, c.width, c.height);
  const lines = [
    { z: -1800, color: '#ffd080' },
    { z: 0, color: '#80d0ff' },
    { z: 2400, color: '#a0ffa0' },
  ];
  lines.forEach((ln, k) => {
    ctx.beginPath();
    for (let i = 0; i <= 1024; i++) {
      const x = -WORLD.half + (i / 1024) * WORLD.size;
      const hh = field.height(x, ln.z);
      const py = c.height - (hh / 3200) * c.height;
      if (i === 0) ctx.moveTo(i, py); else ctx.lineTo(i, py);
    }
    ctx.strokeStyle = ln.color; ctx.lineWidth = 1; ctx.stroke();
  });
}

const t0 = performance.now();
const gen = field.bake();
const times = {};
let last = performance.now();
let lastPhase = null;

function pump() {
  const tStart = performance.now();
  let r;
  while (performance.now() - tStart < 90) {
    r = gen.next();
    if (r.done) break;
    if (r.value.phase !== lastPhase) {
      if (lastPhase) times[lastPhase] = (times[lastPhase] || 0) + (performance.now() - last);
      last = performance.now();
      lastPhase = r.value.phase;
    }
  }
  if (!r.done && r.value.phase !== 'done') {
    log.textContent = `${r.value.label} ${(r.value.progress * 100).toFixed(0)}%`;
    setTimeout(pump, 0);
    return;
  }
  times[lastPhase] = (times[lastPhase] || 0) + (performance.now() - last);
  const total = performance.now() - t0;
  hillshade(document.getElementById('shade'), field.eroded, field.res, field.cell);
  hillshade(document.getElementById('pre'), field.base, field.res, field.cell);
  grayscale(document.getElementById('flow'), field.flow, field.res, 1);
  grayscale(document.getElementById('ao'), field.ao, field.aoRes, 1);
  sections();

  // sample some stats
  const t1 = performance.now();
  let n = 0;
  for (let i = 0; i < 20000; i++) n += field.height((i * 7919) % 8000 - 4000, (i * 104729) % 8000 - 4000);
  const perCall = ((performance.now() - t1) / 20000) * 1000;
  log.textContent =
    `bake ${total.toFixed(0)} ms  ` + Object.entries(times).map(([k, v]) => `${k}:${v.toFixed(0)}`).join(' ') +
    `\nmin ${field.minHeight.toFixed(0)} m  max ${field.maxHeight.toFixed(0)} m` +
    `\nheight() ${perCall.toFixed(2)} µs/call  (${n > 0 ? 'ok' : 'ok'})`;
  window.TERRAIN_READY = true;
}
setTimeout(pump, 0);
</script>
</body>
</html>
